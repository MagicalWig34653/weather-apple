name: Weather
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '27.0'
    watchOS: '27.0'
  createIntermediateGroups: true
  developmentLanguage: de
  knownRegions: [de, en, Base]
configFiles:
  Debug: Configuration/Base.xcconfig
  Release: Configuration/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: '6.0'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic
    # Universal (iPhone + iPad); orientations live in Configuration/Info.plist.
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  Weather:
    type: application
    platform: iOS
    sources:
      - path: Weather
        excludes: [Resources/Icon, '**/*.md']
      - path: Shared
        excludes: ['**/*.md']
      - path: Weather/Resources/Icon/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltEigenentwurf.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltKarte.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltNachtradar.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV2A.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV2B.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV2C.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV3A.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV3B.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV3C.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV3D.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4A.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4B.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4BEigen.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4BS90.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4BS90V.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4C.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV4D.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV5A.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV5B.icon
        type: file
        buildPhase: resources
      - path: Weather/Resources/Icon/Alternates/AltV5C.icon
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID)
        PRODUCT_NAME: Weather
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Alternative icons (Alternates/*.icon); keep in sync with AppIconOption.all (Scripts/check-icon-options.sh).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AltEigenentwurf AltKarte AltNachtradar AltV2A AltV2B AltV2C AltV3A AltV3B AltV3C AltV3D AltV4A AltV4B AltV4BEigen AltV4BS90 AltV4BS90V AltV4C AltV4D AltV5A AltV5B AltV5C"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/Info.plist
    dependencies:
      - target: WeatherWidgets
        embed: true
      - target: WeatherWatch
        embed: true
    entitlements:
      path: Configuration/Weather.entitlements
      properties:
        aps-environment: development
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.security.application-groups: [group.de.linolaske.showernow]
    scheme:
      testTargets: [WeatherTests, WeatherUITests]
      gatherCoverageData: false
  WeatherWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: WeatherWidgets
        excludes: ['**/*.md']
      - path: Shared
        excludes: ['**/*.md']
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID).widgets
        PRODUCT_NAME: WeatherWidgets
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/WeatherWidgets-Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: Configuration/WeatherWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.linolaske.showernow]
  WeatherWatch:
    type: application
    platform: watchOS
    sources:
      - path: WeatherWatch
        excludes: ['**/*.md']
      - path: Shared
        excludes: ['**/*.md']
      - Weather/Data/RadarBackend.swift
      - Weather/Data/RadarHistory.swift
      - Weather/Data/DWDRadarTimeline+App.swift
      - path: Weather/Resources/Icon/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: WeatherWatchWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID).watchkitapp
        PRODUCT_NAME: WeatherWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/WeatherWatch-Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: Configuration/WeatherWatch.entitlements
      properties:
        com.apple.security.application-groups: [group.de.linolaske.showernow]
  WeatherWatchWidgets:
    type: app-extension
    platform: watchOS
    sources:
      - path: WeatherWatchWidgets
        excludes: ['**/*.md']
      - path: Shared
        excludes: ['**/*.md']
      - WeatherWidgets/Logic/PlaceEntity.swift
      - WeatherWidgets/Logic/WidgetForecastLoader.swift
      - WeatherWidgets/Logic/WidgetTimelineBuilder.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID).watchkitapp.widgets
        PRODUCT_NAME: WeatherWatchWidgets
        TARGETED_DEVICE_FAMILY: '4'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Configuration/WeatherWatchWidgets-Info.plist
        SKIP_INSTALL: YES
    entitlements:
      path: Configuration/WeatherWatchWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.de.linolaske.showernow]
  WeatherTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: WeatherTests
        excludes: [Fixtures]
      - path: WeatherTests/Fixtures
        buildPhase: resources
        type: folder
      - path: WeatherWidgets/Logic
    dependencies:
      - target: Weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: '$(inherited) WIDGET_LOGIC_TESTS'
  WeatherUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [WeatherUITests]
    dependencies:
      - target: Weather
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(WEATHER_BUNDLE_ID).uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Weather
